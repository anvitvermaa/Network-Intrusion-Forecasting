# Kafka in KRaft mode (no ZooKeeper) - single broker, for the capstone.
# Modern standard: Confluent 7.6+ / Apache Kafka 3.x run KRaft natively.
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nif-kafka
    ports:
      - "9092:9092"      # external listener (your host connects here)
    environment:
      # --- KRaft mode config (broker + controller in one node) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@nif-kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- listeners ---
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://nif-kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- single-node replication settings ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # a fixed cluster id so data persists across restarts
      CLUSTER_ID: "nif-kafka-cluster-0001"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
